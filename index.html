<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>Les Terres Désolées RP — Connexion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=4">
  <script src="script.js?v=4" defer></script>
</head>

<body>

  <!-- Fonds défilants -->
  <div class="backgrounds" id="backgrounds" aria-hidden="true">
    <img class="background active" src="assets/backgrounds/bg-1.png?v=4" alt="" decoding="async">
    <img class="background" src="assets/backgrounds/bg-2.png?v=4" alt="" decoding="async">
  </div>

  <!-- Effets visuels -->
  <div class="overlay" aria-hidden="true"></div>
  <div class="film-grain" aria-hidden="true"></div>

  <main class="layout">

    <!-- En-tête -->
    <header class="header">
      <span class="header-line"></span>
      <span class="region">
        LES TERRES DÉSOLÉES
        <span class="accent">/</span>
        MOJAVE
      </span>
      <span class="header-line"></span>
    </header>

    <!-- Chargement -->
    <section class="loading"
             role="status"
             aria-label="Connexion au serveur">

      <div class="spinner-frame">
        <div class="spinner-holder">

          <div class="spinner-fallback"
               id="spinner-fallback"></div>

          <img
            id="custom-spinner"
            src="assets/spinner.gif"
            alt=""
            class="custom-spinner"
            hidden
          >

        </div>
      </div>

      <div class="loading-copy">
        CONNEXION AU SERVEUR<span class="dots">...</span>
      </div>

    </section>

    <!-- Pied de page -->
    <footer>
      <span>LES TERRES DÉSOLÉES RP</span>
      <span class="footer-separator">◆</span>
      <span>MOJAVE NETWORK</span>
    </footer>

  </main>

</body>
</html>
